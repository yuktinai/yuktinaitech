<!DOCTYPE html>

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"

  <body>
    <div class="page-noise"></div>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="Yuktinai Technologies home">
          <img src="assets/images/logo-mark.svg" alt="" width="46" height="46" />
          <span>
            <strong>Yuktinai</strong>
            <small>Technologies</small>
          </span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          Menu
        </button>
        <nav id="site-nav" class="site-nav">
          <a href="index.html">Home</a>
          <a href="sdk.html">SDK</a>
          <a href="services.html">Services</a>

          <h1>Let's talk.</h1>
          <p>Send a quick message and we'll get back to you.</p>
        </section>

        <section class="contact-layout-simple">
          <article class="contact-card">
            <p class="service-index">Contact Info</p>
            <h2>yuktinai2026@gmail.com</h2>
            <p>Available for product, IT, monetization, and AI discussions.</p>
          </article>

            <p class="service-index">Message</p>
            <form class="contact-form-simple" action="mailto:yuktinai2026@gmail.com" method="post" enctype="text/plain">
              <label for="message">Your message</label>
              <textarea id="message" name="message" rows="7" placeholder="Tell us about your requirement"></textarea>
              <button class="button button-primary" type="submit">Send</button>
            </form>
          </article>
        </section>
      </main>

      <footer class="site-footer">

        <div>
          <a href="index.html">Home</a>
